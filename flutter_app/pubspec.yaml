name: maprisma_theme
description: "Maprisma Theme: every theme in one place, for COSMIC."
publish_to: 'none'
version: 0.7.3+14

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  maprisma_core_kit:
    git:
      url: https://github.com/maprisma/maprisma-kit.git
      ref: 39c68c8b9dba8d0cc1aa7b3703832ce8f67dc85e # v0.1.0
      path: packages/maprisma_core_kit
  maprisma_ui:
    git:
      url: https://github.com/maprisma/maprisma-kit.git
      ref: 39c68c8b9dba8d0cc1aa7b3703832ce8f67dc85e # v0.1.0
      path: packages/maprisma_ui
  maprisma_theme_core:
    path: ../packages/maprisma_theme_core
  file_selector: ^1.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
